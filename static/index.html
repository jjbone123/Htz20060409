<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻量化 AI 驱动校园人才快速筛选系统</title>
<link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-view" class="login-view hidden">
  <div class="login-card">
    <div class="login-logo"><img src="/static/assets/logo.svg" alt="logo"><h1>轻量化 AI 驱动<br>校园人才快速筛选系统</h1></div>
    <p class="login-sub">数据识人 · 智能推荐 · 精准匹配</p>
    <div class="field">
      <label>账号</label>
      <input id="login-username" type="text" placeholder="请输入账号" autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button id="login-btn" class="btn btn-primary btn-block">登 录</button>
    <p class="login-hint">默认管理员：admin / admin123<br>登录后可在「系统设置」中修改密码、新建 HR 账号</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app-view" class="hidden">
  <header class="topbar">
    <div class="brand">
      <img src="/static/assets/logo.svg" alt="logo">
      <div class="brand-text">
        <span class="brand-name">校园人才快速筛选系统</span>
        <span class="brand-sub">轻量化 AI 驱动</span>
      </div>
    </div>
    <nav class="nav" id="main-nav"></nav>
    <div class="userbox">
      <span class="role-badge" id="role-badge"></span>
      <span class="user-name" id="user-name"></span>
      <button id="logout-btn" class="btn-ghost">退出登录</button>
    </div>
  </header>
  <main id="content" class="content"></main>
</div>

<!-- 通用弹窗与提示 -->
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/static/lib/echarts.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/talent.js"></script>
<script src="/static/js/jobs.js"></script>
<script src="/static/js/match.js"></script>
<script src="/static/js/reports.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
